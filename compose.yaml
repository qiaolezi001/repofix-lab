services:
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      REPOFIX_DATA_DIR: /data
    volumes:
      - task-data:/data
      - ./examples/demo:/input/demo:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    # Diagnosis only: do not mount /var/run/docker.sock or host credentials.
volumes:
  task-data:

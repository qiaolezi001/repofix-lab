[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repofix-lab"
version = "0.1.0"
description = "Evidence-backed Python issue repair agent with isolated verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.scripts]
repofix = "repofix.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/repofix"]

[tool.hatch.build.targets.wheel.force-include]
"examples/demo" = "repofix/examples/demo"
"benchmarks" = "repofix/benchmarks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/tasks", "examples/demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["benchmarks", "examples"]

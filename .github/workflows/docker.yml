name: docker-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - name: Build the trusted test image
        run: docker build --tag repofix-sandbox:0.1 --file Dockerfile.sandbox .
      - name: Execute actual isolated tests and the mock Agent workflow
        run: uv run python scripts/docker_verify.py --output reports/docker-validation.json
      - name: Preserve measured container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-validation
          path: reports/docker-validation.json
          if-no-files-found: error
          retention-days: 30
